# `docker compose up -d` serves the UI/API on http://127.0.0.1:8000 (sign in with HACKEVAL_ADMIN_TOKEN from .env).
# CLI commands run in a one-off container on the same data volume, e.g.
#   docker compose run --rm hackeval status --hackathon demo
services:
  hackeval:
    build: .
    env_file: .env
    environment: # pinned here because env_file would otherwise override the image's paths
      HACKEVAL_CONFIG_DIR: /app/config
      HACKEVAL_WORKSPACE: /data/workspace
      HACKEVAL_DB_PATH: /data/hackeval.db
    ports:
      - "127.0.0.1:8000:8000" # local only; put a TLS reverse proxy in front to expose it
    volumes:
      - hackeval-data:/data
      - ./config:/app/config:ro # edit policy, models and rubrics without rebuilding
    restart: unless-stopped
volumes:
  hackeval-data:
