# LLM per provider and role. Switch provider with HACKEVAL_LLM_PROVIDER=gemini|openai (keys: GOOGLE_API_KEY /
# OPENAI_API_KEY). Gemini ids are plain ADK model strings; OpenAI ids run through our OpenAILlm adapter (src/agents/openaiLlm.ts).
# Verify ids against your account before a real hackathon (`hackeval models` prints the active set).
gemini:
  deck: gemini-3.5-flash
  video: gemini-3.5-flash
  integration: gemini-3.5-flash
  synthesis: gemini-3.5-flash
  transcribe: gemini-3.5-flash
openai:
  deck: gpt-5-mini
  video: gpt-5-mini
  integration: gpt-5-mini
  synthesis: gpt-5
  transcribe: whisper-1
# Optional prices for cost estimates in `hackeval status` (left empty: fill in from your accounts), e.g.
#   prices:
#     gpt-5-mini: {input_per_mtok: <usd>, output_per_mtok: <usd>}
#   jev_price_per_call: <usd>
prices: {}
jev_price_per_call: null
