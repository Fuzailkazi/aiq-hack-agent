name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Media tools (ffmpeg, LibreOffice, poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libreoffice-impress poppler-utils
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run check
      - run: npm --prefix web run typecheck
      - name: OpenAPI types are up to date
        run: npm run api:spec && git diff --exit-code web/openapi.json web/src/api/schema.d.ts
      - run: npm test
      - run: npm run web:test
      - run: npm run build
      - run: npm run web:build
